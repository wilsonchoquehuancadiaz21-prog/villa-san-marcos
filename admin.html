<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Villa San Marcos</title><style>
body{margin:0;background:#f1f4f8;font-family:Arial;color:#17263d}.head{background:#102b55;color:#fff;padding:24px}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:24px;box-shadow:0 8px 28px #102b5515;margin-bottom:18px}label{display:block;font-weight:bold;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:12px 17px;background:#102b55;color:white;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}.red{background:#d91f2b}.muted{color:#64748b}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e5eaf0}.item small{display:block;color:#64748b;margin-top:4px}.hidden{display:none}.error{background:#fff0f0;color:#b42318;padding:12px;border-radius:8px;margin-top:12px}.success{background:#eaf8ef;color:#13733a;padding:12px;border-radius:8px;margin-top:12px}@media(max-width:600px){.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="head"><h2>Proyecto Villa San Marcos</h2>Panel privado de administración</header><main class="wrap"><section class="panel" id="login"><h3>Ingreso del administrador</h3><p class="muted">Usa la cuenta de administrador autorizada.</p><label>Correo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Ingresar</button><div id="loginMsg"></div></section>
<section class="panel hidden" id="app"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>Archivos del proyecto</h3><button id="logout">Cerrar sesión</button></div><p class="muted">Sube fotos de avances, videos de obras y planos en PDF. Puedes eliminar cualquier archivo publicado.</p><label>Título</label><input id="title" placeholder="Ej. Avance de obras"><label>Descripción (opcional)</label><input id="description" placeholder="Breve descripción"><label>Archivo</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,application/pdf"><button id="upload">Subir archivo</button><div id="msg"></div><h3>Archivos publicados</h3><div id="list">Cargando...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const ADMIN='alexanderchoquehuancadiaz@gmail.com';let db=null;const $=id=>document.getElementById(id);function message(id,t,ok=false){$(id).innerHTML=t?`<div class="${ok?'success':'error'}">${t}</div>`:''}
if(window.SUPABASE_URL&&window.SUPABASE_KEY){db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY)}
async function showApp(){const {data:{user}}=await db.auth.getUser();if(user&&user.email?.toLowerCase()===ADMIN){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
$('loginBtn').onclick=async()=>{message('loginMsg','');if(!db){message('loginMsg','Falta configurar config.js.');return}const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){message('loginMsg',error.message);return}await showApp()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function load(){const {data,error}=await db.from('villa_san_marcos_media').select('*').order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}$('list').innerHTML='';if(!data.length){$('list').textContent='Todavía no hay archivos.';return}for(const x of data){const d=document.createElement('div');d.className='item';const left=document.createElement('div');left.innerHTML=`<b></b><small></small>`;left.querySelector('b').textContent=x.title||x.file_path;left.querySelector('small').textContent=x.media_type+' · '+(x.is_published?'Publicado':'Oculto');const b=document.createElement('button');b.className='red';b.textContent='Eliminar';b.onclick=()=>removeItem(x);d.append(left,b);$('list').append(d)}}
async function removeItem(x){if(!confirm('¿Seguro que deseas eliminar este archivo? Esta acción no se puede deshacer.'))return;const {error:s}=await db.storage.from('villa-san-marcos-media').remove([x.file_path]);if(s){message('msg','No se pudo eliminar el archivo del almacenamiento: '+s.message);return}const {error:e}=await db.from('villa_san_marcos_media').delete().eq('id',x.id);if(e){message('msg','Se eliminó el archivo, pero no el registro: '+e.message);return}message('msg','Archivo eliminado correctamente.',true);load()}
$('upload').onclick=async()=>{message('msg','');const f=$('file').files[0];if(!f){message('msg','Selecciona una foto, video o plano PDF.');return}const type=f.type==='application/pdf'?'plan':(f.type.startsWith('video/')?'video':'photo');const path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:u}=await db.storage.from('villa-san-marcos-media').upload(path,f,{upsert:false});if(u){message('msg',u.message);return}const {data:{publicUrl}}=db.storage.from('villa-san-marcos-media').getPublicUrl(path);const {error:i}=await db.from('villa_san_marcos_media').insert({title:$('title').value||f.name,description:$('description').value,media_type:type,file_path:path,public_url:publicUrl,is_published:true});if(i){await db.storage.from('villa-san-marcos-media').remove([path]);message('msg',i.message);return}message('msg','Archivo subido y publicado.',true);$('file').value='';$('title').value='';$('description').value='';load()};
if(db)showApp();else message('loginMsg','Configura primero los datos de Supabase en config.js.');
</script></body></html>
